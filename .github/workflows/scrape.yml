name: Scrape jobs

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # to dispatch the Deploy site workflow after a data refresh

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Workday job details (descriptions, full location lists), so each job's detail is
      # fetched once instead of every day. A new key each run saves the updated cache;
      # restore-keys picks up the latest one. See docs/adapters/workday.md.
      - name: Restore Workday detail cache
        uses: actions/cache@v4
        with:
          path: .cache/workday
          key: workday-details-${{ github.run_id }}
          restore-keys: workday-details-
      - name: Run scraper
        env:
          GETRO_API_KEY: ${{ secrets.GETRO_API_KEY }}
        run: python -m scraper.main
      - name: Commit refreshed data
        run: |
          git config user.name  "brians-job-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/meta.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily job refresh $(date -u +%F)"
            git push
            echo "deploy=1" >> "$GITHUB_OUTPUT"
          fi
        id: commit
      - name: Trigger site deploy
        if: steps.commit.outputs.deploy == '1' && vars.PAGES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      # Runs last so the data is already committed. Fails the run (and GitHub emails the
      # workflow owner) only on a new problem: a board that had jobs went to 0, or a board
      # started failing. See scraper/health.py.
      - name: Board health check
        run: python -m scraper.health data/meta.json
